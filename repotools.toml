#
# Joins this repository to repo_tools. Every tool walks up from the current directory to find this
# file, so its location at the root is the contract.
#
# This file states only what differs from lib/repotools/defaults.toml. Run `repotools config` to see
# the result after the merge of the defaults under it.

[project]
name = "embedded_types"
version = "1.1.0"
spdx = "AGPL-3.0-or-later OR LicenseRef-Commercial OR LicenseRef-Educational"
copyright = "Copyright (C) 2026 Douglas Quigg (dstroy0) <dquigg123@gmail.com>"
prefix = "EMBED"

[layout]
# Headers only, and no src/. The default names both, and a root that is not there is a root a later
# check reports by name.
source = ["include"]
# docs/ holds the hand-written pages of the site. The API pages come from the comments in include/,
# and the three markdown files at the root are the rest of the documentation.
docs = ["docs"]
examples = []
# test/ holds one directory per suite under test/unit, plus harness.py, which builds and runs them.
# There are no fixtures: every input a case needs is a literal in the case.
tests = ["test"]

[prose]
# Each root has its own name here, and "." is not a root. A bare "." would read the two build trees
# and the Unity checkout in each of them, and that prose does not belong to this repository.
roots = ["README.md", "CONTRIBUTING.md", "SECURITY.md", "CHANGELOG.md", "docs", "include", "test", "tools"]

[hooks]
# fetch_check is absent, because [fetch] sets is empty and this repository vendors no tool from
# the toolkit. A gate over nothing reports success over nothing.
gates = ["docs_check"]

[hooks.docs_check]
# Give the checker these roots. With no roots, it adds its own private_roots(), two repositories
# under ../private_repos, and then its count holds prose that is not in this repository.
roots = ["README.md", "CONTRIBUTING.md", "SECURITY.md", "CHANGELOG.md", "docs", "include", "test", "tools"]

[fetch]
# This repository vendors nothing. The toolkit runs from its own checkout, so there is no second copy
# here to drift from it. A set here is a decision to maintain a copy.
sets = []
