sonar.projectKey=dstroy0_embedded_types
sonar.organization=dstroy0

sonar.projectName=embedded_types
sonar.projectVersion=0.1.0

# Paths are relative to this file.
#
# sources and tests are split so the dashboard does not charge test code against the library's own
# duplication and complexity numbers, and so a rule that only makes sense for shipped code is not
# raised against a fixture.
sonar.sources=include
sonar.tests=test
sonar.sourceEncoding=UTF-8

sonar.exclusions=build/**,build-*/**
sonar.coverage.exclusions=test/**

# Coverage is not reported for this project. Every line of it is a macro or a typedef, so a coverage
# number would measure which test happened to expand a macro rather than what the library does. What
# stands in for it is that the headers carry static assertions, and a build that reaches the link
# step has already proved them.
#
# Written by the workflow: build-wrapper records how each TU was really compiled. It is produced
# during the run and is not committed.
sonar.cfamily.compile-commands=bw-output/compile_commands.json
