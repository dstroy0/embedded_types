sonar.projectKey=dstroy0_embedded_types
sonar.organization=dstroy0

sonar.projectName=embedded_types
sonar.projectVersion=3.0.0

# The scanner analyzes C through the translation units of the build, and it analyzes no test file. The library is
# headers alone, so test/headers holds one unit for each header, and those units are sources. The test set leaves
# them out, so no file is in both sets.
sonar.sources=include,test/headers
sonar.tests=test
sonar.sourceEncoding=UTF-8

sonar.exclusions=build/**,build-*/**

sonar.test.exclusions=test/**/unity_runner.c,test/headers/**

sonar.coverage.exclusions=test/**

# The SonarCloud workflow writes both. The build wrapper records how each unit compiled, and test/harness.py
# coverage writes the coverage that gcovr merged. Neither goes into the tree.
sonar.cfamily.compile-commands=bw-output/compile_commands.json
sonar.coverageReportPaths=build-cov/coverage.xml
