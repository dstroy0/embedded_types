name: Proofs

# The Lean proofs of theory/embedded_types, and each GenMC client of test/prove under each memory model, through
# test/harness.py prove.
#
# One GenMC job runs each memory model. The resize client explores tens of millions of executions under one model,
# and that takes hours. Five models in one job pass the six-hour limit of a job, so each model has a job of its own.
# A cache keeps the GenMC build between runs, with the prove tool's hash as its key: an edit to the tool, the tag of
# GenMC among its contents, makes a new build.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proofs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: theory/embedded_types
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        # elan installs the toolchain that lean-toolchain names, at the first lake command.
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build the proofs
        run: lake build

      - name: No proof is open
        # lake build passes a theorem that sorry closes, and only shows a warning. This step fails on it.
        run: |
          if grep -rn --include='*.lean' -w sorry EmbeddedTypes EmbeddedTypes.lean; then
            echo "::error title=sorry::a proof is open"
            exit 1
          fi

  genmc:
    name: GenMC ${{ matrix.model }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        model: [sc, tso, rc11, imm, arm8]
    steps:
      - uses: actions/checkout@v7

      - name: Keep the GenMC build between runs
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/bin/genmc
            ~/.local/include/genmc
            ~/.local/lib/genmc
          key: genmc-${{ runner.os }}-${{ hashFiles('test/prove/prove.py') }}

      - name: Run each client under the model
        # The first run on a host installs the packages of GenMC, then builds and installs the tag that
        # test/prove/prove.py names. A run with the build from the cache installs the packages alone.
        run: python3 test/harness.py prove --model ${{ matrix.model }}

      - name: Keep the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: genmc-${{ matrix.model }}-${{ github.run_id }}
          path: build/prove-*
          if-no-files-found: ignore
