name: Proofs

# The Lean proofs of theory/embedded_types, each CBMC harness of test/prove, and each thread client of test/prove under
# each memory model of GenMC, through test/harness.py prove. test/prove/prove.py holds the flags and the bounds,
# and it stops each prover run at its limit of wall clock.
#
# One GenMC job runs each memory model, so the five models run side by side. A cache retains the GenMC build between
# runs, with the hash of the prove tool as its key. An edit to the tool makes a new build, and the tag of GenMC is
# among its contents.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proofs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: theory/embedded_types
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        # elan installs the toolchain that lean-toolchain names, at the first lake command. The step gets one
        # release of elan and runs it only after its SHA-256 matches the digest of that release.
        env:
          ELAN_VERSION: v4.2.4
          ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        run: |
          curl -sSfL -o "$RUNNER_TEMP/elan.tar.gz" \
            "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ELAN_SHA256  $RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build the proofs
        run: lake build

      - name: No proof is open
        # lake build passes a theorem that sorry closes, and only shows a warning. This step fails on it.
        run: |
          if grep -rn --include='*.lean' -w sorry EmbeddedTypes EmbeddedTypes.lean; then
            echo "::error title=sorry::a proof is open"
            exit 1
          fi

  cbmc:
    name: CBMC
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install CBMC
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cbmc

      - name: Run each harness on each set of defines of its bound
        run: python3 test/harness.py prove --arm cbmc

      - name: Retain the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cbmc-${{ github.run_id }}
          path: build/prove-*
          if-no-files-found: ignore

  genmc:
    name: GenMC ${{ matrix.model }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model: [sc, tso, rc11, imm, arm8]
    steps:
      - uses: actions/checkout@v7

      - name: Retain the GenMC build between runs
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/bin/genmc
            ~/.local/include/genmc
            ~/.local/lib/genmc
          key: genmc-${{ runner.os }}-${{ hashFiles('test/prove/prove.py') }}

      - name: Run each client under the model
        # The first run on a host installs the packages of GenMC, then builds and installs the tag that
        # test/prove/prove.py names. A run with the build from the cache installs the packages alone.
        run: python3 test/harness.py prove --arm genmc --model ${{ matrix.model }}

      - name: Retain the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: genmc-${{ matrix.model }}-${{ github.run_id }}
          path: build/prove-*
          if-no-files-found: ignore
