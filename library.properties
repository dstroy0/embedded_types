sentence=Fixed widths, a machine word, and the compile-time machinery a C11 embedded library is written in.
paragraph=Header only. Names the exact widths once, derives the machine word from the target's pointer width and refuses to guess where it cannot, and carries the compile-time machinery every library above it would otherwise define for itself: a static assertion, feature probes that ask the compiler rather than reading its identity, the attribute wrappers, the unaligned-access word, and the assertions that pin a dispatch table's members to consecutive slots. A consumer aliases these under its own prefix instead of declaring its own, so two libraries in one build agree on what a word is. Nothing is allocated, nothing runs at startup, and the only headers reached are stddef and stdint.
